name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:   # reusable: release.yml gates on this CI workflow

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4 (pinned — CVE-21)

      - name: Install Cyrius toolchain
        # The cyrius.cyml [package].cyrius pin is the single source of
        # truth for the toolchain version — never hardcode it here. Read
        # the pin and hand it to the canonical upstream installer, which
        # fetches + lays out $HOME/.cyrius/{bin,lib}. Do NOT hand-roll
        # curl+tar+cp — scripts/install.sh is the supported entry point
        # (matches patra / sigil).
        run: |
          set -e
          CYRIUS_VERSION="$(grep '^cyrius = ' cyrius.cyml | head -1 | sed 's/cyrius = "\(.*\)"/\1/')"
          echo "Installing Cyrius $CYRIUS_VERSION"
          curl -sSf https://raw.githubusercontent.com/MacCracken/cyrius/main/scripts/install.sh | \
            CYRIUS_VERSION="$CYRIUS_VERSION" sh
          echo "$HOME/.cyrius/bin" >> "$GITHUB_PATH"

      - name: Resolve dependencies
        run: cyrius deps

      - name: Build
        run: |
          mkdir -p build
          cyrius build programs/smoke.cyr build/${{ github.event.repository.name }}-smoke

      - name: Test
        # v5.6.28: bare `cyrius test` picks up the [build].test entry
        # AND auto-discovers tests/*.tcyr — avoids the previous
        # `cyrius test src/test.cyr` form that hard-failed when the
        # stub didn't exist (Issue 1) and also wouldn't ever exercise
        # tests/${proj}.tcyr.
        run: cyrius test

      - name: Cross-compile (agnos)
        # src/scanout.cyr's kernel path (fbinfo#38 / blit#39) is agnos-only,
        # behind #ifdef CYRIUS_TARGET_AGNOS, so host `cyrius test` can't reach
        # it. Gate the agnos target here — this compiles + links the syscall
        # wrappers. Mirrors the darshana precedent (cross-compile gate; real
        # hardware/QEMU acceptance is a separate, manual step). scanout-demo is
        # the M1 acceptance artifact (draws a test pattern + blits it out).
        run: |
          cyrius build --agnos programs/smoke.cyr build/${{ github.event.repository.name }}-smoke-agnos
          cyrius build --agnos programs/scanout-demo.cyr build/scanout-demo-agnos
          cyrius build --agnos programs/input-demo.cyr build/input-demo-agnos
          cyrius build --agnos programs/seat-demo.cyr build/seat-demo-agnos
          cyrius build --agnos programs/backend-demo.cyr build/backend-demo-agnos

      - name: Fuzz
        # Property fuzz over the public output surface (fuzz/bhumi.fcyr):
        # framebuffer bounds, pixel packing, pattern + fbinfo invariants.
        run: cyrius fuzz
